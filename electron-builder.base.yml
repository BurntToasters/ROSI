appId: com.burnttoasters.rosi
productName: Rosi
files:
  - 'dist/**/*'
  - 'src/renderer/**/*'
  - 'licenses.json'
  - '!**/node_modules/*/{test,__tests__,tests}/**'
  - '!**/*.md'
  # yt-dlp binaries are NOT in files — they are copied per-platform via extraResources
directories:
  output: release
publish:
  provider: github
  owner: BurntToasters
  repo: ROSI
win:
  target: nsis
  icon: build/app-icon.ico
  extraResources:
    - from: assets/
      to: assets/
      filter:
        - 'yt-dlp*.exe'
nsis:
  artifactName: ROSI-Windows-${arch}.${ext}
  allowToChangeInstallationDirectory: false
  oneClick: false
  perMachine: false
mac:
  target:
    - dmg
    - zip
  icon: build/app-icon.icns
  artifactName: ROSI-MacOS-universal.${ext}
  extraResources:
    - from: assets/yt-dlp_macos
      to: assets/yt-dlp_macos
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: build/app-icon.png
  category: Utility
  executableArgs:
    - '--ozone-platform=x11'
  extraResources:
    - from: assets/
      to: assets/
      filter:
        - 'yt-dlp_linux*'
appImage:
  artifactName: ROSI-Linux-${arch}.${ext}
deb:
  artifactName: ROSI-Linux-${arch}.${ext}
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
rpm:
  artifactName: ROSI-Linux-${arch}.${ext}
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - at-spi2-core
    - libuuid
    - libsecret
dmg:
  background: build/dmg-background.png
  icon: build/app-icon.png
  iconSize: 100
  contents:
    - x: 120
      'y': 300
      type: file
    - x: 546
      'y': 300
      type: link
      path: /Applications
  window:
    width: 648
    height: 480
