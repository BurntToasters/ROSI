appId: com.burnttoasters.rosi
productName: Rosi
files:
  - '**/*'
  - '!**/node_modules/*/{test,__tests__,tests}/**'
  - '!**/*.md'
  - '!**/package-devonly.js'
  - '!**/dist'
directories:
  output: dist
publish:
  provider: github
  owner: BurntToasters
  repo: ROSI
win:
  target: nsis
  icon: build/app-icon.ico
  asarUnpack:
    - assets/yt-dlp.exe
    - assets/yt-dlp_arm64.exe
nsis:
  artifactName: ROSI-Windows-${arch}.${ext}
  allowToChangeInstallationDirectory: false
  oneClick: false
  perMachine: false
mac:
  target:
    - dmg
    - zip
  icon: build/app-icon.icns
  artifactName: ROSI-MacOS-universal.${ext}
  asarUnpack:
    - assets/yt-dlp_macos
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: build/app-icon.png
  category: Utility
  asarUnpack:
    - assets/yt-dlp_linux
    - assets/yt-dlp_linux_aarch64
appImage:
  artifactName: ROSI-Linux-${arch}.${ext}
deb:
  artifactName: ROSI-Linux-${arch}.${ext}
rpm:
  artifactName: ROSI-Linux-${arch}.${ext}
dmg:
  background: build/dmg-background.png
  icon: build/app-icon.png
  iconSize: 100
  contents:
    - x: 120
      'y': 300
      type: file
    - x: 546
      'y': 300
      type: link
      path: /Applications
  window:
    width: 648
    height: 480
