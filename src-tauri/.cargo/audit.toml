[advisories]
# Ignored advisories are "unmaintained" or "unsound" warnings originating from
# transitive dependencies pulled in by Tauri v2 / wry / webkit2gtk / zbus, plus
# a small set of reviewed zip vulnerabilities (see the zip entry below). The
# warnings are not directly controllable from this crate and are resolved
# upstream as Tauri migrates off the GTK3 stack.
# Plain `cargo audit` still fails on any new advisory in any other crate.
# scripts/check-rustsec-ignore-policy.mjs makes this exact reviewed set expire
# on 2026-12-01 so transitive debt cannot become a permanent silent allowlist.
ignore = [
    # gtk-rs GTK3 bindings - no longer maintained (Tauri Linux webview stack)
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # glib VariantStrIter unsoundness (not reached by this app)
    "RUSTSEC-2024-0429",
    # proc-macro-error unmaintained (transitive build dep)
    "RUSTSEC-2024-0370",
    # unic-* unmaintained (transitive)
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # zbus_names / zvariant / zvariant_derive unmaintained (transitive via zbus
    # from tauri-plugin-single-instance, opener and notification)
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # zip 4.6.1 vulnerabilities, reviewed and not bumped: zip is only a Windows
    # dependency of the vendored tauri-plugin-updater (src-tauri/vendor, kept
    # byte-identical to upstream 2.10.1). The issues concern Unix SUID/permission
    # bits and symlinks escaping the destination, and extraction only happens
    # after minisign verification of the update bytes, so exploiting them needs
    # a validly signed malicious update. The fix needs zip >=9, which requires an
    # upstream updater rebase.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
