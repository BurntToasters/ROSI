<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading ROSI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #523d74, #6839ad 50%, #6029b3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      overflow: hidden;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 250px;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(0.8); opacity: 0.8; }
      to { transform: scale(1); opacity: 1; }
    }
    h1 {
      margin: 0;
      margin-bottom: 5px;
      font-size: 28px;
      letter-spacing: 1px;
    }
    .loading {
      margin-top: 20px;
      width: 80px;
      height: 10px;
      position: relative;
      margin-bottom: 10px;
    }
    .loading:after {
      content: "";
      display: block;
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #13eefd, transparent);
      animation: loading 1s infinite alternate ease-in-out;
    }
    @keyframes loading {
      0% { left: -100%; }
      100% { left: 100%; }
    }
    .version {
      align-self: flex-end;
      font-size: 12px;
      opacity: 0.7;
      font-family: monospace;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="splash-content">
    <img src="app.png" class="logo" alt="ROSI Logo">
    <h1>ROSI</h1>
    <p>Starting up...</p>
    <div class="loading"></div>
    <div class="version" id="version-display">v2.1.2</div>
  </div>
</body>
</html>
