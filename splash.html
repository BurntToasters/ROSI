<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading ROSI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a0f2e 0%, #4a2c6d 50%, #7c4dff 100%);
      background-size: 300% 300%;
      animation: gradientFlow 25s ease infinite;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      overflow: hidden;
    }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 280px;
    }
    .logo {
      width: 140px;
      height: 140px;
      margin-bottom: 30px;
      filter: drop-shadow(0 8px 30px rgba(124, 77, 255, 0.6));
      animation: logoFloat 3s ease-in-out infinite;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    h1 {
      margin: 0;
      margin-bottom: 10px;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 4px 30px rgba(124, 77, 255, 0.7),
                   0 0 60px rgba(124, 77, 255, 0.4);
    }
    p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.8);
      margin: 0;
      font-weight: 500;
    }
    .loading {
      margin-top: 30px;
      width: 120px;
      height: 6px;
      position: relative;
      margin-bottom: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .loading:after {
      content: "";
      display: block;
      position: absolute;
      top: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #7c4dff, #9575ff, transparent);
      box-shadow: 0 0 20px rgba(124, 77, 255, 0.8);
      animation: loading 1.5s infinite ease-in-out;
    }
    @keyframes loading {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    .version {
      align-self: flex-end;
      font-size: 13px;
      opacity: 0.6;
      font-family: 'Courier New', monospace;
      margin-top: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="splash-content">
    <img src="app.png" class="logo" alt="ROSI Logo">
    <h1>ROSI</h1>
    <p>Starting up...</p>
    <div class="loading"></div>
    <div class="version" id="version-display">v2.2.1</div>
  </div>
</body>
</html>
