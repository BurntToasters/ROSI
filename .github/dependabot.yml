version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      tauri:
        patterns:
          - "@tauri-apps/*"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns:
          - "tauri*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
