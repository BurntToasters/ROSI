<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self';"
    />
    <title>Loading ROSI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        --bg-gradient-start: #0f0a1a;
        --bg-gradient-mid: #1a1030;
        --bg-gradient-end: #2d1f4e;
        --accent: #8b5cf6;
        --accent-light: #a78bfa;
        --accent-glow: rgba(139, 92, 246, 0.4);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --text-muted: rgba(255, 255, 255, 0.35);
        --surface-1: rgba(255, 255, 255, 0.03);
        --surface-2: rgba(255, 255, 255, 0.06);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --text-xl: 1.75rem;
        --text-sm: 0.75rem;
        --text-base: 0.9rem;
        --weight-normal: 400;
        --weight-bold: 700;
        --spacing-sm: 0.5rem;
        --spacing-xl: 2rem;
        --spacing-2xl: 3rem;
        --radius-full: 50%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-sans);
        background: linear-gradient(
          145deg,
          var(--bg-gradient-start) 0%,
          var(--bg-gradient-mid) 50%,
          var(--bg-gradient-end) 100%
        );
        background-size: 200% 200%;
        animation: gradientShift 20s ease infinite;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: var(--text-primary);
        overflow: hidden;
      }

      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: var(--spacing-xl);
      }

      .logo-wrapper {
        position: relative;
        margin-bottom: var(--spacing-xl);
      }

      .logo {
        width: 120px;
        height: 120px;
        filter: drop-shadow(0 0 40px var(--accent-glow));
        animation: logoPulse 3s ease-in-out infinite;
      }

      .logo-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 180px;
        height: 180px;
        background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
        border-radius: var(--radius-full);
        animation: glowPulse 3s ease-in-out infinite;
        z-index: -1;
      }

      @keyframes logoPulse {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-8px) scale(1.02);
        }
      }

      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.5;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 0.8;
          transform: translate(-50%, -50%) scale(1.1);
        }
      }

      .app-title {
        font-size: 2.5rem;
        font-weight: var(--weight-bold);
        letter-spacing: 0.1em;
        margin-bottom: var(--spacing-sm);
        color: var(--text-primary);
      }

      .app-subtitle {
        font-size: 0.95rem;
        color: var(--text-secondary);
        font-weight: var(--weight-normal);
        margin-bottom: var(--spacing-2xl);
      }

      .loading-container {
        width: 200px;
      }

      .loading-bar {
        height: 4px;
        background: var(--surface-2);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }

      .loading-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          var(--accent-light),
          transparent
        );
        border-radius: 2px;
        animation: loadingSlide 1.2s ease-in-out infinite;
      }

      @keyframes loadingSlide {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }

      .loading-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 1.5rem;
      }

      .loading-dot {
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: var(--radius-full);
        animation: dotBounce 1.4s ease-in-out infinite;
      }

      .loading-dot:nth-child(1) {
        animation-delay: 0s;
      }
      .loading-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loading-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dotBounce {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      .version {
        position: absolute;
        bottom: 1.5rem;
        right: 1.5rem;
        font-size: var(--text-sm);
        font-family: var(--font-mono);
        color: var(--text-muted);
        letter-spacing: 0.05em;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <img src="app.png" class="logo" alt="ROSI Logo" />
      </div>
      <h1 class="app-title">ROSI</h1>
      <p class="app-subtitle">Starting up...</p>
      <div class="loading-container">
        <div class="loading-bar"></div>
      </div>
    </div>
    <div class="version" id="version-display">v3.5.1</div>
  </body>
</html>
