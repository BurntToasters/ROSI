<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self';"
    />
    <title>Loading ROSI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        --bg-gradient-start: #120e1e;
        --bg-gradient-mid: #18122a;
        --bg-gradient-end: #1e163a;
        --accent: #8b5cf6;
        --accent-light: #a78bfa;
        --accent-dark: #7c3aed;
        --accent-glow: rgba(139, 92, 246, 0.2);
        --accent-subtle: rgba(139, 92, 246, 0.15);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --text-muted: rgba(255, 255, 255, 0.35);
        --surface-2: rgba(255, 255, 255, 0.06);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --radius-full: 50%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-sans);
        background: var(--bg-gradient-mid);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: var(--text-primary);
        overflow: hidden;
      }

      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 0% 50%;
        }
      }

      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2rem;
      }

      .logo-wrapper {
        position: relative;
        margin-bottom: 2rem;
        animation: logoEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes logoEntrance {
        from {
          opacity: 0;
          transform: scale(0.8) translateY(10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .logo {
        width: 100px;
        height: 100px;
        filter: none;
        animation: logoPulse 3s ease-in-out infinite;
        position: relative;
        z-index: 2;
      }

      .logo-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 160px;
        height: 160px;
        background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
        border-radius: var(--radius-full);
        animation: glowPulse 3s ease-in-out infinite;
        z-index: 0;
        opacity: 0.5;
      }

      .logo-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 140px;
        height: 140px;
        margin-top: -70px;
        margin-left: -70px;
        border: 1px solid var(--accent-subtle);
        border-radius: var(--radius-full);
        animation:
          ringRotate 8s linear infinite,
          ringFade 3s ease-in-out infinite;
        z-index: 1;
      }

      .logo-ring::before {
        content: '';
        position: absolute;
        top: -3px;
        left: 50%;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        background: var(--accent-light);
        border-radius: var(--radius-full);
        box-shadow: none;
      }

      .logo-ring-2 {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 170px;
        height: 170px;
        margin-top: -85px;
        margin-left: -85px;
        border: 1px solid rgba(139, 92, 246, 0.08);
        border-radius: var(--radius-full);
        animation:
          ringRotate 12s linear infinite reverse,
          ringFade 4s ease-in-out infinite 1s;
        z-index: 0;
      }

      @keyframes ringRotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes ringFade {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 0.8;
        }
      }

      @keyframes logoPulse {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-6px) scale(1.02);
        }
      }

      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.4;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1.15);
        }
      }

      .app-title {
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        margin-bottom: 0.4rem;
        color: var(--text-primary);
        animation: titleEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
      }

      @keyframes titleEntrance {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .app-subtitle {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 400;
        letter-spacing: 0.04em;
        margin-bottom: 2.5rem;
        animation: titleEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
      }

      .loading-container {
        width: 180px;
        animation: titleEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
      }

      .loading-track {
        height: 3px;
        background: var(--surface-2);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }

      .loading-track::after {
        content: '';
        position: absolute;
        top: 0;
        left: -50%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        border-radius: 2px;
        animation: loadingSlide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes loadingSlide {
        0% {
          left: -50%;
        }
        100% {
          left: 100%;
        }
      }

      .loading-label {
        display: flex;
        justify-content: center;
        margin-top: 1rem;
        font-size: 0.7rem;
        color: var(--text-muted);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        animation: loadingFade 2s ease-in-out infinite;
      }

      @keyframes loadingFade {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 0.8;
        }
      }

      .version {
        position: absolute;
        bottom: 1.2rem;
        right: 1.2rem;
        font-size: 0.7rem;
        font-family: var(--font-mono);
        color: var(--text-muted);
        letter-spacing: 0.05em;
        opacity: 0;
        animation: versionFade 0.5s ease 0.8s forwards;
      }

      @keyframes versionFade {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <div class="logo-ring"></div>
        <div class="logo-ring-2"></div>
        <img src="app.png" class="logo" alt="ROSI Logo" />
      </div>
      <h1 class="app-title">ROSI</h1>
      <p class="app-subtitle">Starting up...</p>
      <div class="loading-container">
        <div class="loading-track"></div>
        <div class="loading-label">Loading</div>
      </div>
    </div>
    <div class="version" id="version-display">v4.0.13</div>
    <script>
      setTimeout(function () {
        var label = document.querySelector('.loading-label');
        if (label) label.textContent = 'Still loading — this is taking longer than usual…';
      }, 15000);
    </script>
  </body>
</html>
